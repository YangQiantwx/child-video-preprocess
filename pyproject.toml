[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "child-video-preprocess"
version = "0.1.0"
description = "Lightweight research baseline for child-centered behavioral video preprocessing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yang Qian" }]
dependencies = [
  "ultralytics>=8.4.46",
  "opencv-python>=4.8.0",
  "numpy>=1.24",
  "lap>=0.5.12",
  "tqdm>=4.66",
]

[project.scripts]
cvp-preprocess = "run_pipeline:main"

[tool.setuptools]
py-modules = ["run_pipeline"]
